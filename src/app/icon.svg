<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <!-- Atlas Iconic Stylized Chevron "A" -->
  <defs>
    <linearGradient id="actYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e830" />
      <stop offset="100%" stop-color="#c9cf1c" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.2" />
    </filter>
  </defs>
  <!-- Background rounded pill for crisp tab visibility in both light & dark browser modes -->
  <rect width="128" height="128" rx="28" fill="#1b364b" />
  <!-- Stylized Atlas "A" Apex -->
  <polygon points="64,16 106,104 84,104 64,52 44,104 22,104" fill="url(#actYellow)" filter="url(#shadow)" />
  <!-- Subtle accent inner bevel -->
  <polygon points="64,52 84,104 64,88" fill="#b1b618" opacity="0.6" />
</svg>
